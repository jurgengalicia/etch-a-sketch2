<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch V2</title>
     <script defer src="script.js"></script>
     <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-container">
        <h1>Welcome to etch-a-sketch!</h1>
        <div class="etch-container">
            <div class="button-container">
                <div>
                    <label>Change trail color</label>
                    <input type="color"  class="palette-button"> 
                </div>
                <button id="border-button">toggle borders</button>
                <div class="slide-container">
                    <div><button class="resolution">change border</button></div>
                    <span class="reso-info">border size: 12 x 12</span>
                </div>
                <button id="rainbow-button">Rainbow etch!</button>
                <button id="gradient-button">Gradient toggle</button>
            </div>
            <div class="board-container"></div>
        </div>
        
    </div>
    
</body>
</html>
